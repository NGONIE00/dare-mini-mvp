<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="900" height="620" style="background:#0f0f0f;font-family:'Courier New',monospace;">

  <!-- Background grid -->
  <defs>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1a1a1a" stroke-width="0.5"/>
    </pattern>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="900" height="620" fill="url(#grid)"/>

  <!-- Title -->
  <text x="450" y="38" text-anchor="middle" fill="#D97706" font-size="18" font-weight="bold" letter-spacing="4" filter="url(#glow)">DARE — THE DIGITAL COUNCIL</text>
  <text x="450" y="56" text-anchor="middle" fill="#555" font-size="10" letter-spacing="3">SYSTEM ARCHITECTURE · PROTOTYPE v1</text>

  <!-- ═══════════════════════════════════════
       ROW 1: USER TYPES
  ════════════════════════════════════════ -->

  <!-- Feature Phone User -->
  <rect x="30" y="80" width="160" height="80" rx="8" fill="#1a1000" stroke="#D97706" stroke-width="1.5"/>
  <text x="110" y="102" text-anchor="middle" fill="#D97706" font-size="9" letter-spacing="2">FEATURE PHONE USER</text>
  <text x="110" y="120" text-anchor="middle" fill="#fbbf24" font-size="20">📱</text>
  <text x="110" y="140" text-anchor="middle" fill="#666" font-size="9">Dials *447# · No internet</text>
  <text x="110" y="152" text-anchor="middle" fill="#666" font-size="9">Any phone · 2G network</text>

  <!-- Smartphone User -->
  <rect x="230" y="80" width="160" height="80" rx="8" fill="#0a1020" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="310" y="102" text-anchor="middle" fill="#3B82F6" font-size="9" letter-spacing="2">SMARTPHONE USER</text>
  <text x="310" y="120" text-anchor="middle" fill="#60a5fa" font-size="20">💻</text>
  <text x="310" y="140" text-anchor="middle" fill="#666" font-size="9">dare-mini-mvp.vercel.app</text>
  <text x="310" y="152" text-anchor="middle" fill="#666" font-size="9">Full web experience</text>

  <!-- Host -->
  <rect x="430" y="80" width="160" height="80" rx="8" fill="#0a1a0a" stroke="#059669" stroke-width="1.5"/>
  <text x="510" y="102" text-anchor="middle" fill="#059669" font-size="9" letter-spacing="2">HOST / CREATOR</text>
  <text x="510" y="120" text-anchor="middle" fill="#34d399" font-size="20">🎙️</text>
  <text x="510" y="140" text-anchor="middle" fill="#666" font-size="9">Creates rooms · Earns tips</text>
  <text x="510" y="152" text-anchor="middle" fill="#666" font-size="9">AI tools · Dashboard</text>

  <!-- Grant Reviewer -->
  <rect x="630" y="80" width="240" height="80" rx="8" fill="#1a0a1a" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="750" y="102" text-anchor="middle" fill="#7C3AED" font-size="9" letter-spacing="2">GRANT REVIEWER / EVALUATOR</text>
  <text x="750" y="120" text-anchor="middle" fill="#a78bfa" font-size="20">📊</text>
  <text x="750" y="140" text-anchor="middle" fill="#666" font-size="9">/analytics · /ussd · /demo</text>
  <text x="750" y="152" text-anchor="middle" fill="#666" font-size="9">Mozilla · Shuttleworth · Indigo</text>

  <!-- Arrows down to client layer -->
  <line x1="110" y1="160" x2="110" y2="210" stroke="#D97706" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="310" y1="160" x2="310" y2="210" stroke="#3B82F6" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="510" y1="160" x2="510" y2="210" stroke="#059669" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="750" y1="160" x2="750" y2="210" stroke="#7C3AED" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- ═══════════════════════════════════════
       ROW 2: ACCESS LAYER
  ════════════════════════════════════════ -->

  <!-- USSD Gateway -->
  <rect x="30" y="210" width="160" height="70" rx="8" fill="#1a1000" stroke="#D97706" stroke-width="1"/>
  <text x="110" y="232" text-anchor="middle" fill="#D97706" font-size="9" letter-spacing="1">USSD GATEWAY</text>
  <text x="110" y="248" text-anchor="middle" fill="#fbbf24" font-size="9">NetOne · Econet · Telecel</text>
  <text x="110" y="262" text-anchor="middle" fill="#555" font-size="8">*447# · Free to dial</text>
  <text x="110" y="274" text-anchor="middle" fill="#555" font-size="8">Phone call for audio</text>

  <!-- Next.js App -->
  <rect x="220" y="210" width="460" height="70" rx="8" fill="#111" stroke="#444" stroke-width="1"/>
  <text x="450" y="232" text-anchor="middle" fill="#aaa" font-size="9" letter-spacing="2">NEXT.JS 16 · VERCEL (Washington DC)</text>
  <text x="290" y="254" text-anchor="middle" fill="#666" font-size="8">/rooms  /ussd  /demo</text>
  <text x="450" y="254" text-anchor="middle" fill="#666" font-size="8">/dashboard  /analytics</text>
  <text x="610" y="254" text-anchor="middle" fill="#666" font-size="8">/register  /signin</text>
  <text x="290" y="270" text-anchor="middle" fill="#555" font-size="8">TypeScript · Tailwind v4</text>
  <text x="450" y="270" text-anchor="middle" fill="#555" font-size="8">App Router · Turbopack</text>
  <text x="610" y="270" text-anchor="middle" fill="#555" font-size="8">useVoice hook</text>

  <!-- Reviewer access -->
  <rect x="700" y="210" width="170" height="70" rx="8" fill="#1a0a1a" stroke="#7C3AED" stroke-width="1"/>
  <text x="785" y="232" text-anchor="middle" fill="#7C3AED" font-size="9" letter-spacing="1">ANALYTICS · USSD SIM</text>
  <text x="785" y="252" text-anchor="middle" fill="#a78bfa" font-size="8">Real-time Supabase data</text>
  <text x="785" y="266" text-anchor="middle" fill="#555" font-size="8">Impact metrics · Inclusion stats</text>
  <text x="785" y="278" text-anchor="middle" fill="#555" font-size="8">*447# interactive simulator</text>

  <!-- Arrows down -->
  <line x1="450" y1="280" x2="450" y2="320" stroke="#555" stroke-width="1"/>
  <polygon points="445,318 455,318 450,325" fill="#555"/>

  <!-- ═══════════════════════════════════════
       ROW 3: API + SERVICES
  ════════════════════════════════════════ -->
  <text x="450" y="345" text-anchor="middle" fill="#444" font-size="9" letter-spacing="3">API ROUTES</text>

  <!-- Agora Token -->
  <rect x="60" y="355" width="155" height="75" rx="8" fill="#0a1020" stroke="#3B82F6" stroke-width="1"/>
  <text x="138" y="374" text-anchor="middle" fill="#3B82F6" font-size="9" letter-spacing="1">AGORA RTC</text>
  <text x="138" y="390" text-anchor="middle" fill="#60a5fa" font-size="8">/api/agora-token</text>
  <text x="138" y="404" text-anchor="middle" fill="#555" font-size="8">Token generation</text>
  <text x="138" y="416" text-anchor="middle" fill="#555" font-size="8">Opus codec · 8–64 KB/min</text>
  <text x="138" y="428" text-anchor="middle" fill="#555" font-size="8">Speaking indicators</text>

  <!-- AI Route -->
  <rect x="245" y="355" width="180" height="75" rx="8" fill="#1a1000" stroke="#D97706" stroke-width="1"/>
  <text x="335" y="374" text-anchor="middle" fill="#D97706" font-size="9" letter-spacing="1">ANTHROPIC CLAUDE</text>
  <text x="335" y="390" text-anchor="middle" fill="#fbbf24" font-size="8">/api/ai · claude-sonnet-4-6</text>
  <text x="335" y="404" text-anchor="middle" fill="#555" font-size="8">Room descriptions · Summaries</text>
  <text x="335" y="416" text-anchor="middle" fill="#555" font-size="8">Content moderation</text>
  <text x="335" y="428" text-anchor="middle" fill="#555" font-size="8">Host assistant · Recs</text>

  <!-- Supabase -->
  <rect x="455" y="355" width="180" height="75" rx="8" fill="#0a1a0a" stroke="#059669" stroke-width="1"/>
  <text x="545" y="374" text-anchor="middle" fill="#059669" font-size="9" letter-spacing="1">SUPABASE</text>
  <text x="545" y="390" text-anchor="middle" fill="#34d399" font-size="8">PostgreSQL · Auth · Realtime</text>
  <text x="545" y="404" text-anchor="middle" fill="#555" font-size="8">RLS · Triggers · Functions</text>
  <text x="545" y="416" text-anchor="middle" fill="#555" font-size="8">Wallet sync · Room status</text>
  <text x="545" y="428" text-anchor="middle" fill="#555" font-size="8">Storage: avatars · recordings</text>

  <!-- Mobile Money -->
  <rect x="665" y="355" width="175" height="75" rx="8" fill="#1a1000" stroke="#D97706" stroke-width="1"/>
  <text x="752" y="374" text-anchor="middle" fill="#D97706" font-size="9" letter-spacing="1">MOBILE MONEY</text>
  <text x="752" y="390" text-anchor="middle" fill="#fbbf24" font-size="8">EcoCash · Mukuru</text>
  <text x="752" y="404" text-anchor="middle" fill="#fbbf24" font-size="8">OneMoney · M-Pesa</text>
  <text x="752" y="416" text-anchor="middle" fill="#555" font-size="8">Tips · Ticket payments</text>
  <text x="752" y="428" text-anchor="middle" fill="#555" font-size="8">85% direct to creator</text>

  <!-- Arrows down to DB layer -->
  <line x1="545" y1="430" x2="545" y2="470" stroke="#059669" stroke-width="1"/>
  <polygon points="540,468 550,468 545,475" fill="#059669"/>

  <!-- ═══════════════════════════════════════
       ROW 4: DATABASE SCHEMA
  ════════════════════════════════════════ -->
  <rect x="30" y="475" width="840" height="110" rx="10" fill="#0a1a0a" stroke="#1a3a1a" stroke-width="1"/>
  <text x="450" y="496" text-anchor="middle" fill="#059669" font-size="9" letter-spacing="3">DATABASE SCHEMA (SUPABASE POSTGRESQL)</text>

  <!-- Tables -->
  <g fill="#1a2a1a" stroke="#2a4a2a" stroke-width="0.5">
    <rect x="48" y="504" width="90" height="68" rx="4"/>
    <rect x="148" y="504" width="90" height="68" rx="4"/>
    <rect x="248" y="504" width="105" height="68" rx="4"/>
    <rect x="363" y="504" width="90" height="68" rx="4"/>
    <rect x="463" y="504" width="90" height="68" rx="4"/>
    <rect x="563" y="504" width="90" height="68" rx="4"/>
    <rect x="663" y="504" width="100" height="68" rx="4"/>
    <rect x="773" y="504" width="88" height="68" rx="4"/>
  </g>

  <!-- Table content -->
  <text x="93" y="518" text-anchor="middle" fill="#059669" font-size="8" font-weight="bold">profiles</text>
  <text x="93" y="530" text-anchor="middle" fill="#555" font-size="7">id · phone_hash</text>
  <text x="93" y="541" text-anchor="middle" fill="#555" font-size="7">display_name · bio</text>
  <text x="93" y="552" text-anchor="middle" fill="#555" font-size="7">user_type · avatar</text>
  <text x="93" y="563" text-anchor="middle" fill="#555" font-size="7">follower_count</text>

  <text x="193" y="518" text-anchor="middle" fill="#059669" font-size="8" font-weight="bold">rooms</text>
  <text x="193" y="530" text-anchor="middle" fill="#555" font-size="7">id · host_id</text>
  <text x="193" y="541" text-anchor="middle" fill="#555" font-size="7">title · category</text>
  <text x="193" y="552" text-anchor="middle" fill="#555" font-size="7">status · scheduled</text>
  <text x="193" y="563" text-anchor="middle" fill="#555" font-size="7">is_ticketed · price</text>

  <text x="300" y="518" text-anchor="middle" fill="#059669" font-size="8" font-weight="bold">room_participants</text>
  <text x="300" y="530" text-anchor="middle" fill="#555" font-size="7">room_id · user_id</text>
  <text x="300" y="541" text-anchor="middle" fill="#555" font-size="7">payment_status</text>
  <text x="300" y="552" text-anchor="middle" fill="#555" font-size="7">joined_at</text>
  <text x="300" y="563" text-anchor="middle" fill="#555" font-size="7">→ triggers count</text>

  <text x="408" y="518" text-anchor="middle" fill="#059669" font-size="8" font-weight="bold">messages</text>
  <text x="408" y="530" text-anchor="middle" fill="#555" font-size="7">room_id · user_id</text>
  <text x="408" y="541" text-anchor="middle" fill="#555" font-size="7">message · created</text>
  <text x="408" y="552" text-anchor="middle" fill="#555" font-size="7">realtime push</text>
  <text x="408" y="563" text-anchor="middle" fill="#555" font-size="7">AI moderated</text>

  <text x="508" y="518" text-anchor="middle" fill="#059669" font-size="8" font-weight="bold">follows</text>
  <text x="508" y="530" text-anchor="middle" fill="#555" font-size="7">follower_id</text>
  <text x="508" y="541" text-anchor="middle" fill="#555" font-size="7">following_id</text>
  <text x="508" y="552" text-anchor="middle" fill="#555" font-size="7">→ notifications</text>
  <text x="508" y="563" text-anchor="middle" fill="#555" font-size="7">trigger on insert</text>

  <text x="608" y="518" text-anchor="middle" fill="#059669" font-size="8" font-weight="bold">wallets</text>
  <text x="608" y="530" text-anchor="middle" fill="#555" font-size="7">user_id · balance</text>
  <text x="608" y="541" text-anchor="middle" fill="#555" font-size="7">currency · updated</text>
  <text x="608" y="552" text-anchor="middle" fill="#555" font-size="7">→ auto-synced</text>
  <text x="608" y="563" text-anchor="middle" fill="#555" font-size="7">via trigger</text>

  <text x="713" y="518" text-anchor="middle" fill="#059669" font-size="8" font-weight="bold">transactions</text>
  <text x="713" y="530" text-anchor="middle" fill="#555" font-size="7">from/to user_id</text>
  <text x="713" y="541" text-anchor="middle" fill="#555" font-size="7">amount · type</text>
  <text x="713" y="552" text-anchor="middle" fill="#555" font-size="7">tip · ticket</text>
  <text x="713" y="563" text-anchor="middle" fill="#555" font-size="7">withdrawal</text>

  <text x="817" y="518" text-anchor="middle" fill="#059669" font-size="8" font-weight="bold">notifications</text>
  <text x="817" y="530" text-anchor="middle" fill="#555" font-size="7">user_id · type</text>
  <text x="817" y="541" text-anchor="middle" fill="#555" font-size="7">message · read</text>
  <text x="817" y="552" text-anchor="middle" fill="#555" font-size="7">room_id · from</text>
  <text x="817" y="563" text-anchor="middle" fill="#555" font-size="7">realtime bell</text>

  <!-- Footer -->
  <text x="450" y="608" text-anchor="middle" fill="#333" font-size="8" letter-spacing="2">DARE · NGONIE00 · GITHUB.COM/NGONIE00/DARE-MINI-MVP · dare-mini-mvp.vercel.app</text>

</svg>
